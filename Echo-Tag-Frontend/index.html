<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#161226" />
    <title>Echo Tag</title>

    <!-- Poki SDK: loaded async, never blocks first paint. The game boots with or without it. -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" async></script>



    <!-- Inline favicon: a real file would be one more request, and a missing one is a 404. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161226'/%3E%3Crect x='6' y='6' width='7' height='7' fill='%23ffc07a' opacity='.35'/%3E%3Crect x='13' y='13' width='7' height='7' fill='%23ffc07a' opacity='.6'/%3E%3Crect x='20' y='20' width='7' height='7' fill='%23ffc07a'/%3E%3C/svg%3E" />

    <!-- Critical CSS is inlined at build time; nothing here blocks rendering. -->
    <style>
      :root { color-scheme: dark; --bg: #161226; --ink: #f6f1ff; --accent: #ffc07a; }
      * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
        font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      /* Two canvases, not one: a canvas is permanently bound to the first context type it
         hands out, so a 2D preview and a WebGL arena cannot share one element. #preview
         sits on top until the engine is live, then cross-fades away. */
      /* The explicit 100%/100% is load-bearing, not belt-and-braces. A <canvas> is a
         replaced element: with width:auto it lays out at its *attribute* size, so
         `position:fixed; inset:0` alone leaves a 2880x1800 backing store occupying
         2880x1800 CSS pixels inside a 1440x900 viewport — half the arena off-screen, and
         every CSS-pixel measurement off by the device pixel ratio. */
      #stage, #preview { position: fixed; inset: 0; display: block; touch-action: none;
        width: 100%; height: 100%; }
      #preview { z-index: 1; transition: opacity .28s ease-out; }
      #preview.gone { opacity: 0; pointer-events: none; }
      #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      /* The menu: the game's square language — hard corners, chunky drop-blocks, dusk +
         apricot. The player is a square-person; the UI is built from the same bricks. */
      #menu { position: absolute; inset: 0; display: grid; place-content: center;
        gap: 14px; justify-items: center; }
      #menu.busy { pointer-events: none; opacity: .7; }
      #title { color: #f6f1ff; font: 900 30px/1 system-ui, sans-serif; letter-spacing: .3em;
        margin: 0 0 4px; text-shadow: 4px 4px 0 rgba(0,0,0,.45); }
      #menu button { pointer-events: auto; cursor: pointer; border: 0;
        font: 800 15px/1 system-ui, sans-serif; letter-spacing: .12em; }
      #play { padding: 18px 58px; font-size: 22px; color: #241505; background: var(--accent);
        box-shadow: 6px 6px 0 rgba(0,0,0,.4), 0 10px 44px rgba(255,178,100,.25); }
      #play:active { transform: translate(3px,3px); box-shadow: 3px 3px 0 rgba(0,0,0,.4); }
      #status { font: 600 13px/1.4 system-ui, sans-serif; color: #b3a8c9; text-align: center;
        max-width: 30ch; margin: 0; }
      #mp { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        margin-top: 10px; }
      #mp button, #joinform input { background: #262048; color: #e9ddff; padding: 12px 16px;
        border: 3px solid #3a3150; box-shadow: 4px 4px 0 rgba(0,0,0,.35); }
      #mp button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
      #joinform { display: flex; gap: 0; pointer-events: auto; }
      /* 16px minimum on the input, or iOS Safari zooms the whole page on focus. */
      #joinform input { width: 9ch; font: 800 16px/1 ui-monospace, monospace;
        letter-spacing: .2em; text-transform: uppercase; outline: none; border-right: 0; }
      #joinform input:focus { border-color: var(--accent); }
      #joinform button { border-left: 0; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="preview"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/boot/main.ts"></script>
  </body>
</html>
