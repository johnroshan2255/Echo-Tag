<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#161226" />
    <title>Echo Tag — multiplayer ghost tag with friends</title>
    <meta name="description" content="Tag, but the monster is one of you. Chase friends through 4 haunted pixel worlds — ghost, spider, alien — 12 players, free, no download." />

    <!-- Link previews: a shared ?room=CODE invite must unfurl as a game card, not a bare
         URL — the unfurl IS the invitation. Relative image: Discord/Telegram/WhatsApp
         resolve it against the page URL wherever the game is hosted. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Echo Tag — play with me!" />
    <meta property="og:description" content="Multiplayer ghost tag: don't be the monster when the clock runs out. 4 haunted worlds, 12 players, free in your browser." />
    <meta property="og:image" content="og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Installability: phones offer Add to Home Screen, so a player keeps a door back in. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Poki SDK: loaded async, never blocks first paint. The game boots with or without it. -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" async></script>



    <!-- Inline favicon: a real file would be one more request, and a missing one is a 404. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161226'/%3E%3Crect x='6' y='6' width='7' height='7' fill='%23ffc07a' opacity='.35'/%3E%3Crect x='13' y='13' width='7' height='7' fill='%23ffc07a' opacity='.6'/%3E%3Crect x='20' y='20' width='7' height='7' fill='%23ffc07a'/%3E%3C/svg%3E" />

    <!-- Critical CSS is inlined at build time; nothing here blocks rendering. -->
    <style>
      :root { color-scheme: dark; --bg: #161226; --ink: #f6f1ff; --accent: #ffc07a;
        --pf: 'PS2P', ui-monospace, monospace; }
      /* Press Start 2P (SIL OFL), self-hosted subsets — the UI speaks the cast's language.
         Body copy stays system-ui for readability; PS2P is for names, labels and buttons. */
      @font-face { font-family: 'PS2P'; font-display: swap; src: url(ps2p-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2191, U+2193; }
      @font-face { font-family: 'PS2P'; font-display: swap; src: url(ps2p-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20C0; }
      @font-face { font-family: 'PS2P'; font-display: swap; src: url(ps2p-cyrillic.woff2) format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      /* Pixel chrome, shared by menu, dialogs, lobby and HUD: staircase-notched corners
         (the UI is built from the same fat pixels as the cast) plus a chunky bevel.
         External shadows on clipped elements must use filter: drop-shadow so they follow
         the notched silhouette. Browsers without clip-path just keep square corners. */
      .px, .px-s, .px-xs { --p: 6px; clip-path: polygon(
        0 calc(2*var(--p)), var(--p) calc(2*var(--p)), var(--p) var(--p),
        calc(2*var(--p)) var(--p), calc(2*var(--p)) 0,
        calc(100% - 2*var(--p)) 0, calc(100% - 2*var(--p)) var(--p),
        calc(100% - var(--p)) var(--p), calc(100% - var(--p)) calc(2*var(--p)),
        100% calc(2*var(--p)), 100% calc(100% - 2*var(--p)),
        calc(100% - var(--p)) calc(100% - 2*var(--p)),
        calc(100% - var(--p)) calc(100% - var(--p)),
        calc(100% - 2*var(--p)) calc(100% - var(--p)), calc(100% - 2*var(--p)) 100%,
        calc(2*var(--p)) 100%, calc(2*var(--p)) calc(100% - var(--p)),
        var(--p) calc(100% - var(--p)), var(--p) calc(100% - 2*var(--p)),
        0 calc(100% - 2*var(--p))); }
      .px-s { --p: 4px; }
      /* CRT scanlines for panel faces — two-pixel stripes, barely there. */
      .crt { background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 2px, rgba(0,0,0,0) 2px 4px); }
      .px-xs { --p: 2px; }
      .bv { box-shadow: inset 3px 3px 0 rgba(255,255,255,.08), inset -3px -3px 0 rgba(0,0,0,.28); }
      .bv-a { box-shadow: inset 3px 3px 0 rgba(255,255,255,.32), inset -3px -3px 0 rgba(0,0,0,.18); }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
        font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      /* Two canvases, not one: a canvas is permanently bound to the first context type it
         hands out, so a 2D preview and a WebGL arena cannot share one element. #preview
         sits on top until the engine is live, then cross-fades away. */
      /* The explicit 100%/100% is load-bearing, not belt-and-braces. A <canvas> is a
         replaced element: with width:auto it lays out at its *attribute* size, so
         `position:fixed; inset:0` alone leaves a 2880x1800 backing store occupying
         2880x1800 CSS pixels inside a 1440x900 viewport — half the arena off-screen, and
         every CSS-pixel measurement off by the device pixel ratio. */
      #stage, #preview { position: fixed; inset: 0; display: block; touch-action: none;
        width: 100%; height: 100%; }
      #preview { z-index: 1; transition: opacity .28s ease-out; }
      #preview.gone { opacity: 0; pointer-events: none; }
      #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      /* The menu: the game's square language — hard corners, chunky drop-blocks, dusk +
         apricot. The player is a square-person; the UI is built from the same bricks. */
      /* `safe center` keeps the top reachable if the menu ever outgrows a short screen;
         browsers without the keyword fall back to the plain center on the line before. */
      #menu { position: absolute; inset: 0; display: grid; gap: 14px; justify-items: center;
        overflow-y: auto; place-content: center; place-content: safe center;
        /* One shadow for the whole menu: clip-path clips a same-element drop-shadow away,
           so the filter lives here and every notched child casts its own pixel shadow. */
        filter: drop-shadow(5px 5px 0 rgba(0,0,0,.4)); }
      #menu.busy { pointer-events: none; opacity: .7; }
      #title { color: #f6f1ff; font: 400 21px/1.3 var(--pf); letter-spacing: .12em;
        margin: 0 0 4px; }
      #menu button { pointer-events: auto; cursor: pointer; border: 0;
        font: 400 10px/1.4 var(--pf); letter-spacing: .04em; }
      #play { padding: 18px 46px; font-size: 15px; color: #241505; background: var(--accent); }
      #play:active { transform: translate(3px,3px); }
      #status { font: 600 13px/1.4 system-ui, sans-serif; color: #b3a8c9; text-align: center;
        max-width: 30ch; margin: 0; }
      #mp { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        margin-top: 10px; }
      #mp button, #joinform input { background: #262048; color: #e9ddff; padding: 12px 16px;
        border: 3px solid #3a3150; }
      #mp > button:active { transform: translate(2px,2px); }
      #joinform { display: flex; gap: 0; pointer-events: auto; }
      /* 16px minimum on the input, or iOS Safari zooms the whole page on focus.
         11ch: codes are 5 letters, but the localised placeholder (CODIGO) needs room. */
      #joinform input { width: 11ch; font: 800 16px/1 ui-monospace, monospace;
        letter-spacing: .2em; text-transform: uppercase; outline: none; border-right: 0; }
      #joinform input:focus { border-color: var(--accent); }
      #joinform button { border-left: 0; }
      /* Landscape phones: shrink the chrome so the map preview, Play and the multiplayer
         row all stay on a ~390px-tall screen. */
      @media (max-height: 520px) {
        #menu { gap: 8px; }
        #title { font-size: 15px; margin: 0; }
        #play { padding: 10px 34px; font-size: 12px; }
        #status { font-size: 12px; }
        #mp { margin-top: 4px; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="preview"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/boot/main.ts"></script>
  </body>
</html>
