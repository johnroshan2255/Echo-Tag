<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Echo Tag</title>

    <!-- Poki SDK: loaded async, never blocks first paint. The game boots with or without it. -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js" async></script>

    <!-- Warm the websocket path while the game chunk is still downloading. -->
    <link rel="preconnect" href="%VITE_WS_ORIGIN%" crossorigin />

    <!-- Critical CSS is inlined at build time; nothing here blocks rendering. -->
    <style>
      :root { color-scheme: dark; --bg: #12141c; --ink: #f4f6ff; --accent: #38e8ff; }
      * { margin: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
        font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #stage { position: fixed; inset: 0; display: block; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/boot/main.ts"></script>
  </body>
</html>
