name: CI
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test        # simulation invariants
      - run: npm run bench:sim   # step-cost + allocation gate
      - run: npm run build
      - run: npm run size        # hard gate on load-time budget
      # Headless Chrome smoke check. Hosted runners have no GPU, so this step needs
      # --enable-unsafe-swiftshader and failIfMajorPerformanceCaveat:false before it can be
      # made blocking — see the CI note in docs/RUNNING.md. Non-blocking until then.
      - run: npm run check:browser
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-screenshots
          path: tools/check/screenshots/
